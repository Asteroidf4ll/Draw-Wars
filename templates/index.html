<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="board-wrap">
        <!-- 房间覆盖层 -->
        <div id="roomOverlay" class="room-overlay">
            <div class="room-card">
                <h2>多人协作画板</h2>
                <div id="userNameText" class="user-name-editable"></div>
                <input id="roomInput" maxlength="4" placeholder="输入4位房间号">
                <button id="joinRoomBtn">进入房间</button>
            </div>
        </div>

        <!-- 主工具栏 -->
        <div class="toolbar">
            <button id="activeColorPicker" class="color-trigger" type="button" title="调色"></button>
            <button id="brushPanelBtn" type="button">笔刷</button>
            <button id="eraserPanelBtn" type="button" class="eraser">橡皮擦</button>
            <button id="panToolBtn" type="button" class="secondary">视角拖动</button>
            <div class="group">
                <label for="sizeSlider">大小</label>
                <input id="sizeSlider" type="range" min="1" max="500" value="3">
                <input id="sizeInput" type="number" min="1" max="500" value="3">
                <span id="sizeValue">px</span>
            </div>
            <div class="opacity-control">
                <span>透明度</span>
                <input type="range" id="opacitySlider" min="1" max="100" value="100">
                <input type="number" id="opacityInput" min="1" max="100" value="100">
                <span id="opacityValue">100%</span>
            </div>
            <button id="undoBtn" type="button" class="secondary">撤销</button>
            <button id="redoBtn" type="button" class="secondary">重做</button>
            <button id="saveBtn" type="button">保存 PNG</button>
            <button id="exportSnapshotBtn" type="button" class="secondary">导出快照</button>
            <button id="importSnapshotBtn" type="button" class="secondary">📂 导入快照</button>
            <input type="file" id="snapshotFileInput" accept=".json" style="display: none;">
            <button id="clearBtn" type="button">清空当前图层</button>
        </div>

        <!-- 子工具栏 + 事件管理按钮 -->
        <div class="sub-toolbar">
            <div class="group">
                <label for="canvasWidthInput">宽</label>
                <input id="canvasWidthInput" type="number" min="800" max="5000" value="800">
                <label for="canvasHeightInput">高</label>
                <input id="canvasHeightInput" type="number" min="600" max="5000" value="600">
                <button id="resizeCanvasBtn" type="button" class="secondary">修改画布</button>
            </div>
            <div class="group">
                <label for="zoomSlider">缩放</label>
                <input id="zoomSlider" type="range" min="10" max="300" step="5" value="100">
                <input id="zoomInput" type="number" min="10" max="300" step="1" value="100">
                <span>%</span>
                <button id="resetZoomBtn" type="button" class="secondary">100%</button>
            </div>
            <button id="eventManagerBtn" type="button" class="secondary">📡 事件</button>
            <button id="chatToggleSidebarBtn" type="button" class="secondary">💬 聊天</button>
        </div>

        <!-- 事件管理内嵌面板（默认隐藏） -->
        <div id="inlineEventPanel" class="inline-event-panel" style="display: none;">
            <div class="event-control-header">
                <div>
                    <div class="event-control-kicker">事件管理</div>
                    <div id="eventCurrentLabel" class="event-control-title">当前暂无事件</div>
                </div>
                <div class="event-count-row">
                    <span id="eventCurrentCountdown" class="event-count-pill">结束倒计时 —</span>
                    <span id="eventNextCountdown" class="event-count-pill">下一轮 —</span>
                </div>
            </div>
            <div class="event-control-body">
                <div class="event-control-grid">
                    <label class="event-control-field">
                        <span>持续时长（秒）</span>
                        <input id="eventDurationInput" type="number" min="5" max="7200" value="120" disabled>
                    </label>
                    <label class="event-control-field">
                        <span>下一轮周期（秒）</span>
                        <input id="eventIntervalInput" type="number" min="5" max="7200" value="120" disabled>
                    </label>
                    <label class="event-control-field event-control-select-field">
                        <span>指定下一轮</span>
                        <div class="event-control-select-row">
                            <select id="eventNextSelect" disabled>
                                <option value="">不指定</option>
                            </select>
                            <button id="eventNextApplyBtn" type="button" class="secondary" disabled>应用</button>
                        </div>
                    </label>
                    <div class="event-control-field event-control-action-field">
                        <span>快速操作</span>
                        <div class="event-control-actions">
                            <button id="eventForceNextBtn" type="button" disabled>立即下一轮</button>
                            <button id="eventForceEndBtn" type="button" class="secondary" disabled>结束全部</button>
                        </div>
                    </div>
                </div>
                <div class="event-active-box">
                    <div class="event-pool-head"><span>进行中事件</span></div>
                    <div id="eventActiveList" class="event-active-list"></div>
                </div>
                <div class="event-pool-box">
                    <div class="event-pool-head"><span>事件池</span></div>
                    <div id="eventPoolGrid" class="event-pool-grid"></div>
                </div>
            </div>
        </div>

        <!-- 颜色选择器 -->
        <div id="colorPopover" class="color-popover">
            <!-- 内容不变，省略... -->
            <div class="dual-color-row">
                <button id="primarySlot" class="slot-chip active" type="button" title="前景色"></button>
                <button id="secondarySlot" class="slot-chip" type="button" title="背景色"></button>
                <button id="swapColorsBtn" type="button">切换颜色</button>
            </div>
            <div class="mode-tabs">
                <button id="rgbModeBtn" type="button" class="active">RGB 模式</button>
                <button id="wheelModeBtn" type="button">色轮模式</button>
            </div>
            <div id="rgbPanel" class="color-panel active">
                <div class="rgb-sv-wrap"><canvas id="rgbSvCanvas" width="240" height="240"></canvas></div>
                <div class="hue-row"><label for="rgbHueRange">H</label><input id="rgbHueRange" type="range" min="0" max="360" value="0"></div>
                <div class="control-row"><label for="rRange">R</label><input id="rRange" type="range" min="0" max="255"><input id="rInput" type="number" min="0" max="255"></div>
                <div class="control-row"><label for="gRange">G</label><input id="gRange" type="range" min="0" max="255"><input id="gInput" type="number" min="0" max="255"></div>
                <div class="control-row"><label for="bRange">B</label><input id="bRange" type="range" min="0" max="255"><input id="bInput" type="number" min="0" max="255"></div>
            </div>
            <div id="wheelPanel" class="color-panel">
                <div class="color-wheel-wrap"><canvas id="wheelCanvas" width="240" height="240"></canvas></div>
                <div class="control-row"><label for="hRange">H</label><input id="hRange" type="range" min="0" max="360"><input id="hInput" type="number" min="0" max="360"></div>
                <div class="control-row"><label for="sRange">S</label><input id="sRange" type="range" min="0" max="100"><input id="sInput" type="number" min="0" max="100"></div>
                <div class="control-row"><label for="vRange">V</label><input id="vRange" type="range" min="0" max="100"><input id="vInput" type="number" min="0" max="100"></div>
            </div>
            <div class="history-title">历史颜色（落笔后记录）</div>
            <div class="history-grid" id="colorHistoryGrid"></div>
        </div>

        <!-- 笔刷/橡皮面板 -->
        <div class="picker-panels" id="pickerPanels">
            <section id="brushPanel" class="picker-panel" data-panel="brush">
                <div class="tool-grid" id="brushGrid"></div>
            </section>
            <section id="eraserPanel" class="picker-panel" data-panel="eraser">
                <div class="tool-grid" id="eraserGrid"></div>
            </section>
        </div>

        <!-- 画布工作区 -->
        <section class="workspace">
            <section class="canvas-zone" id="canvasZone">
                <div class="canvas-stage" id="canvasStage">
                    <div id="layerStack" class="layer-stack"></div>
                    <div id="brushCursor" aria-hidden="true"></div>
                </div>
            </section>
        </section>

        <!-- 左侧图层抽屉 -->
        <button id="layerDrawerToggle" class="layer-drawer-toggle left" type="button">图层</button>
        <aside id="layerDrawer" class="layer-drawer left-drawer">
            <div class="layer-drawer-header">
                <h3>图层</h3>
                <button id="addLayerBtn" type="button">添加图层</button>
            </div>
            <div id="layerList" class="layer-drawer-body"></div>
        </aside>

        <!-- 右侧聊天侧边栏 -->
        <aside id="chatSidebar" class="chat-sidebar">
            <div class="chat-sidebar-header">
                <span>💬 聊天</span>
                <button id="chatSidebarCloseBtn" class="chat-sidebar-close">⌄</button>
            </div>
            <div class="chat-sidebar-body">
                <div id="chatMessages" class="chat-messages"></div>
                <div class="chat-form">
                    <input id="chatInput" type="text" class="chat-input" placeholder="输入消息..." maxlength="200">
                    <button id="chatSendBtn" type="submit" class="chat-send-btn">发送</button>
                </div>
            </div>
        </aside>

        <!-- 通知与表情 -->
        <div id="topToast" class="top-toast"></div>
        <div id="chatNotificationContainer" class="chat-notification-container"></div>
        <div id="emojiWheel" class="emoji-wheel hidden">
            <div class="emoji-wheel-inner">
                <div class="emoji-wheel-item" data-index="0">😀</div>
                <div class="emoji-wheel-item" data-index="1">😂</div>
                <div class="emoji-wheel-item" data-index="2">😍</div>
                <div class="emoji-wheel-item" data-index="3">😭</div>
                <div class="emoji-wheel-item" data-index="4">😡</div>
                <div class="emoji-wheel-item" data-index="5">🎉</div>
                <div class="emoji-wheel-item" data-index="6">👍</div>
                <div class="emoji-wheel-item" data-index="7">❤️</div>
            </div>
        </div>
        <div id="emojiFloatingContainer" class="emoji-floating-container"></div>
    </main>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
